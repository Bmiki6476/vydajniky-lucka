<style>
:root{
  --bg:#0f1b27; --panel:#172738; --panel2:#1c3044; --ink:#e8f0f7; --muted:#8ea4b8; --line:#284057;
  --accent:#2aa8e6; --accent-ink:#04131f; --accent-soft:#143a54;
  --ok:#5fd08f; --ok-bg:#163526; --warn:#f2b45a; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3d1c1a;
  --info:#7cc4ff; --info-bg:#15314a; --chip:#203549; --shadow:0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:#132232;border-bottom:2px solid var(--accent)}
header.top .wrap{padding-top:10px;padding-bottom:10px}
.titlerow{display:flex;align-items:center;gap:8px}
.titlerow h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);border:0;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;flex:none}
.iconbtn svg{width:20px;height:20px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;border:0;background:none;padding:0;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.cak i{background:var(--warn)} .sync.off i{background:var(--bad)}
main{padding-top:12px}
.filters{display:grid;gap:8px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
select{max-width:100%;text-overflow:ellipsis}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=password],textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip b{font-weight:600;opacity:.75;margin-left:4px}
.group{margin:16px 0 8px;display:flex;align-items:baseline;gap:8px}
.group h2{font-size:14px;margin:0;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.group span{font-size:13px;color:var(--muted)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;box-shadow:var(--shadow)}
.item.cak{border-style:dashed}
.item .main{flex:1;min-width:0}
.item .name{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .qty{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;color:var(--muted)}
.item .qty .n{font-weight:650;font-size:16px;color:var(--ink)}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.p-nie{background:var(--chip);color:var(--muted)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:560;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13.5px}
.btn.big{min-height:56px;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.big svg{width:24px;height:24px}
.btn:disabled{opacity:.5}
.more{width:100%;margin-top:10px;border-style:dashed}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:flex;max-width:640px}
nav.bottom button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.bottom button.on{color:var(--accent);font-weight:650}
nav.bottom svg{width:22px;height:22px}
nav.bottom .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:0 5px;min-width:17px;line-height:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)} .kpi .v.ok{color:var(--ok)} .kpi .v.info{color:var(--info)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
tr.sum td{font-weight:650}
.tscroll{overflow-x:auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.actions{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.actions.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld{min-width:0}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:560}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:24px;height:24px;margin:0;accent-color:var(--ok);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 6px;font-size:13.5px;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.stavbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stavbox .kde{font-weight:600}
.hist{display:grid;gap:6px}
.hrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.hrow.cak{border-style:dashed}
.hrow .t{font-weight:600}
.hrow .m{font-size:12px;color:var(--muted);margin-top:2px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:13.5px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - 16px);overflow-y:auto;overflow-x:hidden;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-height:calc(100% - 48px)}}
.sheet .hd{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet .hd h2{font-size:16px;margin:0;line-height:1.3;overflow-wrap:anywhere}
.sheet .hd .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.sheet .hd .x,.sheet .hd .back{border:0;background:var(--chip);border-radius:99px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.sheet .hd .x{margin-left:auto}
.sheet .hd .tt{min-width:0;flex:1}
.sheet .bd{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.scan{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column}
.scan.on{display:flex}
/* obraz kamery je pod panelom – Safari na iPhone natiahne video podľa výšky obrazu a panel by vypadol z obrazovky */
.scan video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.scan .ciel{position:absolute;left:50%;top:calc((100% - 180px) / 2);width:min(64vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:18px;pointer-events:none}
.scan .bar2{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(12,18,26,.92);color:#fff;display:grid;gap:10px}
.scan .bar2 .msg{font-size:15px;min-height:1.4em}
.scan .bar2 .row{flex-wrap:nowrap}
.scan .bar2 input{background:#222;border-color:#444;color:#fff}
/* režim fotky: Google aplikáciu spúšťa v rámčeku bez povolenia kamery – skenuje sa cez fotoaparát telefónu */
.scan.foto-rezim video,.scan.foto-rezim .ciel{display:none}
.scan.foto-rezim{justify-content:flex-end;background:#0b1520}
.scan.foto-rezim .bar2{position:static;padding-top:24px}
.scan.foto-rezim #scanFoto{min-height:64px;font-size:17px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scan.foto-rezim #scanStop{background:#1c2b3a;border-color:#2a3f53;color:#e8f0f7}
.scan .info{display:none;color:#b9cfe0;font-size:14px;line-height:1.5;padding:0 18px 8px}
.scan.foto-rezim .info{display:block}
.foto{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px}
.foto.on{display:flex}
.foto img{max-width:100%;max-height:100%;border-radius:8px}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow-y:auto}
.instal{width:100%;max-width:400px;display:grid;gap:10px;margin:0;border-color:var(--accent)}
.instal ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.instal .navod{display:grid;gap:8px;font-size:14px}
.login.on{display:flex}
.login .card{width:100%;max-width:400px;display:grid;gap:12px;margin:0}
.login h2{margin:0;font-size:20px}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
#tlac{display:none}
@media print{
  @page{size:62mm 36mm;margin:0}
  body{background:#fff;padding:0}
  body>*:not(#tlac){display:none!important}
  #tlac{display:block}
  #tlac img{display:block;width:62mm;height:36mm;page-break-after:always;break-after:page}
}
.stitky{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.stitky img{width:100%;border-radius:6px;background:#fff;border:1px solid var(--line)}
.podpis-plocha{width:100%;height:220px;background:#fff;border-radius:12px;touch-action:none;display:block;border:2px dashed var(--line)}
/* Flex štýl: značka, dlaždice, karta výdajníka */
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px;color:var(--accent);flex:none}
.brand b{color:var(--accent);font-weight:700}
.hello{margin:6px 0 14px}
.hello h2{margin:0;font-size:21px;font-weight:650}
.hello .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:116px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile svg{width:36px;height:36px;color:var(--accent)}
.tile .t{font-weight:650;font-size:15.5px;line-height:1.25}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile .b2{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 9px}
.fx{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.fx .fxh{background:linear-gradient(90deg,#14324b,#1d4d70);padding:12px 14px;display:flex;align-items:center;gap:10px}
.fx .fxh svg{width:22px;height:22px;color:var(--accent);flex:none}
.fx .fxh .tt{font-weight:650;font-size:16px}
.fx .fxh .vc{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.02em}
.fx .fxh .m{font-size:13.5px;color:#b9cfe0;margin-top:2px}
.fx .fxs{padding:9px 14px;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--panel2);border-top:1px solid var(--line)}
.fx .fxbox{padding:12px 14px}
.fx dl.dl{padding:12px 14px;margin:0;grid-template-columns:minmax(110px,auto) minmax(0,1fr)}
.fx dl.dl dt{color:var(--muted)}
.fx table{font-size:13.5px}
.fx th{background:var(--panel2)}
.fx th,.fx td{padding:8px 10px}
.vyber tr[data-k]{cursor:pointer}
.vyber tr.on td{background:var(--accent);color:var(--accent-ink);font-weight:650}
.vinput{display:flex;gap:8px}
.vinput input{flex:1;min-width:0}
.vinput .btn{flex:none}
.rychly-list{display:grid;gap:6px}
@media (max-width:440px){.iconbtn span,.sync span{display:none}.titlerow h1{font-size:15.5px}.who{max-width:34%}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="titlerow">
      <h1 class="brand"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1" opacity=".75"/><rect x="17" y="3" width="4" height="5" rx="1" opacity=".5"/><rect x="3" y="10" width="5" height="5" rx="1" opacity=".75"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1" opacity=".5"/></svg><span>Výdajníky <b>Lucka</b></span></h1>
      <button class="sync" id="syncBtn" type="button" data-act="tab" data-tab="viac"><i></i><span id="syncTxt">…</span></button>
      <button class="iconbtn" type="button" data-act="skenNajdi" aria-label="Skenovať QR kód"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 12h10"/></svg><span>Skenovať</span></button>
      <button class="who" id="whoBtn" type="button" data-act="ucet" aria-label="Môj účet – odhlásiť"></button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="bottom"><div class="wrap" id="nav"></div></nav>

<div class="login" id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h2>Výdajníky Lucka</h2>

    vyd:Object.values(SRV.vyd).map(o => p.map(k => bezSpin && k === 'spin' ? '' : o[k] ?? '')), mie:Object.values(SRV.mie).map(o => pm.map(k => o[k] ?? '')),
    poh:Object.values(SRV.poh), ser:Object.values(SRV.ser), ul:Object.values(SRV.ul)});
  try { localStorage.setItem(K_CACHE, balik(false)); return; } catch(e) {}

}

/** Zmena = operácia; rovnako ju aplikuje mobil (hneď) aj server (po odoslaní). */
function aplikuj(v, op){
  if (op.t === 'pohyb' || op.t === 'servis') {
    const s = v.vyd[op.vyd]; if (!s) return;
    const x = Object.assign({}, s), z = x.miesto;
    prechod(x, op); x.cak = true; v.vyd[x.id] = x;
    if (op.t === 'pohyb') v.poh[op.id] = {id:op.id, cas:op.cas, vyd:x.id, vc:x.vc, typ:op.typ, z, kam:x.miesto, stavPo:x.stav, dl:op.dl || '', pozn:op.pozn || '', uloha:op.uloha || '', kto:C.meno, cak:true};
    else v.ser[op.id] = {id:op.id, cas:op.cas, vyd:x.id, vc:x.vc, typ:op.typ, vysledok:op.vysledok || '', popis:op.popis || '', diely:op.diely || '', miesto:x.miesto, kto:C.meno, cak:true};
  } else if (op.t === 'vydajnik') {
    const s = v.vyd[op.vyd];
    if (!s && !op.novy) return;
    const x = Object.assign(s ? Object.assign({}, s) : {id:op.vyd, vc:op.vyd, stav:op.stav || 'spinavy', miesto:op.kam || '', odKedy:op.cas, zaradenie:op.cas.slice(0,10), fotky:''}, op.patch || {});
    x.cak = true; v.vyd[x.id] = x;
  } else if (op.t === 'miesto') {
    const s = v.mie[op.id];
    v.mie[op.id] = Object.assign(s ? Object.assign({}, s) : {id:op.id, typ:'zakaznik'}, op.patch || {}, {cak:true});
  } else if (op.t === 'podpis') {
    const text = (op.meno || 'zákazník') + '||' + op.cas;
    for (const id of op.pohyby || []) if (v.poh[id]) v.poh[id] = Object.assign({}, v.poh[id], {podpis:text});
    if (op.uloha && v.ul[op.uloha]) v.ul[op.uloha] = Object.assign({}, v.ul[op.uloha], {podpis:text, cak:true});
  } else if (op.t === 'uloha') {
    const s = v.ul[op.id], p = Object.assign({}, op.patch || {});
    const u = Object.assign(s ? Object.assign({}, s) : {id:op.id, stav:'nova', zadal:C.meno, vytvorene:op.cas}, p, {cak:true});
    if ('hotovo' in p) { if (p.hotovo) { u.stav = 'hotova'; u.hotovo = op.cas; u.hotovoKto = C.meno; } else { u.stav = 'nova'; u.hotovo = ''; } }
    v.ul[op.id] = u;
  }
}
function obnovView(){
  if (!SRV) { V = null; return; }
  V = {vyd:Object.assign({}, SRV.vyd), mie:Object.assign({}, SRV.mie), poh:Object.assign({}, SRV.poh), ser:Object.assign({}, SRV.ser), ul:Object.assign({}, SRV.ul)};
  for (const op of POTVRD) if (op.rv > SRV.rev) aplikuj(V, op);
  for (const op of OUT) aplikuj(V, op);
  V.poMieste = {}; V.pocty = {};
  for (const v of Object.values(V.vyd)) {
    V.pocty[v.stav] = (V.pocty[v.stav] || 0) + 1;
    if (v.stav !== 'vyradeny' && v.miesto) (V.poMieste[v.miesto] = V.poMieste[v.miesto] || []).push(v);
  }
}
/** Viac zmien naraz (hromadný presun) – jedno uloženie a jedno prekreslenie. */
function zmenViac(ops){
  const cas = new Date().toISOString();
  for (const op of ops) { op.id = op.id || noveId(op.t[0].toUpperCase()); op.cas = cas; OUT.push(op); }
  ulozOut(); obnovView(); obnovVsetko();
  clearTimeout(zmen.t); zmen.t = setTimeout(sync, 700);
}
/** Pridá zmenu do fronty, hneď ju ukáže a naplánuje odoslanie. */
function zmen(op){
  op.id = op.id || noveId(op.t[0].toUpperCase());
  op.cas = new Date().toISOString();
  OUT.push(op);
  ulozOut(); obnovView(); obnovVsetko();
  clearTimeout(zmen.t); zmen.t = setTimeout(sync, 700);
}

/* ---------- synchronizácia ---------- */
function prijmi(r, polia){
  for (const a of r.vydajniky || []) { const o = zPola(a, polia || SRV.polia); SRV.vyd[o.id] = o; }
  for (const a of r.miesta || []) { const o = zPola(a, SRV.poliaMiest); SRV.mie[o.id] = o; }
  for (const x of r.pohyby || []) SRV.poh[x.id] = x;
  for (const x of r.servis || []) SRV.ser[x.id] = x;
  for (const x of r.ulohy || []) SRV.ul[x.id] = x;
  if (r.ludia) SRV.ludia = r.ludia;
  // v mobile držíme len posledné týždne pohybov a servisu
  const hr = new Date(Date.now() - 35 * 864e5).toISOString();
  for (const k of ['poh','ser']) for (const [id, x] of Object.entries(SRV[k])) if (x.cas < hr) delete SRV[k][id];
}
async function nacitajVsetko(){
  const r = await api('nacitaj', C.pin);
  SRV = {rev:r.rev, meta:r.meta, polia:r.polia, poliaMiest:r.poliaMiest, ludia:r.ludia, vyd:{}, mie:{}, poh:{}, ser:{}, ul:{}};
  prijmi(r, r.polia);
  C.meno = r.meta.meno; C.rola = r.meta.rola; if (!C.sklad && r.meta.sklad) C.sklad = r.meta.sklad; ulozConf();
  ulozCache(); online = true; poslednaSync = new Date();
  obnovView(); postavNav(); vykresli();
}
let syncBezi = false, syncZnova = false;
async function sync(){
  if (!C.pin || !SRV) return;
  if (syncBezi) { syncZnova = true; return; }
  syncBezi = true; obnovSyncStav();
  try {
    if (OUT.length) {
      const davka = OUT.slice(0, 80);
      davka.forEach(o => { o.odosiela = true; });
      let res;
      try { res = await api('zapis', C.pin, davka.map(o => { const c = Object.assign({}, o); delete c.odosiela; return c; })); }
      catch(e) { davka.forEach(o => { delete o.odosiela; }); throw e; }
      OUT.splice(0, davka.length); ulozOut();
      if (res && res.rev) davka.forEach(o => { delete o.odosiela; o.rv = res.rev; POTVRD.push(o); });
      if (res && res.odmietnute && res.odmietnute.length) toast('Neuložené: ' + res.odmietnute.map(x => x.dovod).join(' · '), 6000);
      if (OUT.length) syncZnova = true;
    }
    const r = await api('zmeny', C.pin, SRV.rev, SRV.meta.verzia);
    if (r.reload) { await nacitajVsetko(); toast('Dáta boli aktualizované'); }
    else {
      const bolo = ['vydajniky','miesta','pohyby','servis','ulohy'].some(k => (r[k] || []).length);
      prijmi(r); SRV.rev = r.rev; ulozCache();
      POTVRD = POTVRD.filter(o => o.rv > SRV.rev);
      obnovView();
      if (bolo) obnovVsetko();
    }
    online = true; poslednaSync = new Date();
  } catch(e) {
    if (jeChybaKodu(e)) { odhlas(true); toast('Kód už neplatí – prihláste sa znova.', 4000); }
    else online = false;
  } finally {
    syncBezi = false; obnovSyncStav();
    if (syncZnova) { syncZnova = false; setTimeout(sync, 300); }
  }
}
function obnovSyncStav(){
  const b = $('#syncBtn'), t = $('#syncTxt');
  b.classList.remove('cak','off');
  if (online === false) { b.classList.add('off'); t.textContent = OUT.length ? `Offline · ${OUT.length} čaká` : 'Offline'; }
  else if (OUT.length) { b.classList.add('cak'); t.textContent = `Odosiela ${OUT.length}`; }
  else t.textContent = syncBezi && !poslednaSync ? 'Načítava…' : 'Uložené';
  if (C.tab === 'viac') TABS.viac.obnov();
}
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });

const sklady = () => Object.values(V.mie).filter(m => m.typ === 'sklad' && m.zmazane !== 'áno').sort((a, b) => (a.id === NEZ) - (b.id === NEZ) || a.nazov.localeCompare(b.nazov, 'sk'));
const miesto = id => V.mie[id] || null;
const nazovMiesta = id => { if (!id) return '—'; const m = V.mie[id]; return m ? m.nazov : id; };
const jeSklad = id => { const m = V.mie[id]; return !!m && m.typ === 'sklad'; };
const mojSklad = () => C.sklad && V.mie[C.sklad] ? C.sklad : '';
const nasVlastnik = v => !v.vlastnik;
const jadro = id => String(id).split(' ')[0];
/** Nájde výdajník podľa QR, výrobného čísla (aj „serial no“ s prefixom) alebo evidenčného čísla 230/19. */
function najdiVyd(t){
  const id = normVc(t); if (!id) return [];
  if (V.vyd[id]) return [V.vyd[id]];
  const vsetky = Object.values(V.vyd);
  if (/^\d{1,5}\/\d{2,4}$/.test(id)) return vsetky.filter(v => v.ev === id);
  const j = jadro(id);
  return vsetky.filter(v => { const k = jadro(v.id); return k === j || (j.length >= 8 && k.length >= 8 && (j.endsWith(k) || k.endsWith(j))); });
}
const kodVyrobku = f => /^(ean_13|ean_8|upc_a|upc_e)$/.test(f || '');
function hladajVyd(q, limit){
  const n = norm(q); if (!n) return [];
  const id = normVc(q), out = [];
  for (const v of Object.values(V.vyd)) {
    if (v.id.includes(id) || (v.ev && v.ev === id) || norm(v.model).includes(n) || norm(nazovMiesta(v.miesto)).includes(n)) { out.push(v); if (out.length >= (limit || 60)) break; }
  }
  return out;
}
function hladajMiesta(q, typ, limit){
  const n = norm(q);
  const r = Object.values(V.mie).filter(m => m.zmazane !== 'áno' && (!typ || m.typ === typ) &&
    (!n || norm(m.nazov + ' ' + m.mesto + ' ' + m.adresa + ' ' + m.ico + ' ' + m.id + ' ' + m.fakt).includes(n)));
  r.sort((a, b) => ((V.poMieste[b.id] || []).length - (V.poMieste[a.id] || []).length) || a.nazov.localeCompare(b.nazov, 'sk'));
  return limit ? r.slice(0, limit) : r;
}
function poTermine(){

  return Object.values(V.vyd).filter(v => v.stav === 'zakaznik' && Math.min(mesiacov(v.odKedy) ?? 999, mesiacov(v.sanitacia) ?? 999) >= hr);
}

    $('#pSklady').innerHTML = riad.length ? `<table><tr><th>Sklad</th><th class="r">Pripravené</th><th class="r">Čaká na san.</th><th class="r">V oprave</th><th class="r">Na vyradenie</th><th class="r">Spolu</th></tr>
      ${riad.map(r => `<tr><td><a href="#" data-act="miesto" data-id="${esc(r.s.id)}">${esc(r.s.nazov)}</a></td>${r.n.map(x => `<td class="r">${x || ''}</td>`).join('')}<td class="r"><b>${r.spolu}</b></td></tr>`).join('')}
      <tr class="sum"><td>Spolu na skladoch</td>${suma.map(x => `<td class="r">${x}</td>`).join('')}<td class="r">${suma.reduce((a, b) => a + b, 0)}</td></tr></table>
      <p class="note">Aktívnych výdajníkov spolu ${akt}, z toho u zákazníkov ${p.zakaznik || 0}.</p>` : '<div class="empty-state">Na skladoch nie je nič. Najprv nahrajte dáta zo SPIN (Viac → Import).</div>';
    const pt = poTermine(), poZak = {};
    for (const v of pt) (poZak[v.miesto] = poZak[v.miesto] || []).push(v);
    const zak = Object.entries(poZak).sort((a, b) => b[1].length - a[1].length);
    $('#pTerminInfo').textContent = `${pt.length} ${sk(pt.length,'výdajník je','výdajníky sú','výdajníkov je')} u zákazníka bez výmeny a sanitácie dlhšie ako ${SRV.meta.sanitMesiacov} mesiacov – ${zak.length} zákazníkov.`;
    $('#pTermin').innerHTML = zak.length ? `<div class="list">${zak.slice(0, 25).map(([id, a]) => { const m = miesto(id) || {nazov:id, mesto:''};
      const naj = a.map(v => [v.odKedy, v.sanitacia].filter(Boolean).sort().pop() || '').sort()[0];
      return `<div class="item"><div class="main"><div class="name"><a href="#" data-act="miesto" data-id="${esc(id)}">${esc(m.nazov)}</a></div><div class="sub">${esc(m.mesto)} · ${a.length} ks · najstarší ${esc(naj ? fmtD(naj) : 'bez záznamu')}</div></div>
        <button class="btn small" type="button" data-act="novaUloha" data-miesto="${esc(id)}" data-typ="vymena" data-pocet="${a.length}">Úloha</button></div>`; }).join('')}</div>
      ${zak.length > 25 ? `<p class="note">… a ďalších ${zak.length - 25} zákazníkov (celý zoznam: Výdajníky → filter U zákazníka, export).</p>` : ''}` : '<div class="empty-state">Nič po termíne.</div>';
    const dni = [];
    for (let i = 0; i < 7; i++) dni.push(denIso(Date.now() - i * 864e5));
    const poh = Object.values(V.poh), ser = Object.values(V.ser);
    const c = (arr, d, f) => arr.filter(x => denIso(x.cas) === d && f(x)).length || '';
    $('#pAkt').innerHTML = `<table><tr><th>Deň</th><th class="r">Výdaje</th><th class="r">Zvozy</th><th class="r">Sanitácie</th><th class="r">Opravy</th><th class="r">Návrhy na vyr.</th></tr>
      ${dni.map(d => `<tr><td>${esc(fmtD(d))}</td><td class="r">${c(poh, d, x => x.typ === 'vydaj')}</td><td class="r">${c(poh, d, x => x.typ === 'prijem')}</td><td class="r">${c(ser, d, x => x.typ === 'sanitacia')}</td><td class="r">${c(ser, d, x => x.typ === 'oprava')}</td><td class="r">${c(ser, d, x => x.typ === 'navrh')}</td></tr>`).join('')}</table>`;
    if (!$('#vOd').value) { const d = new Date(); const od = new Date(d.getFullYear(), d.getMonth() - 1, 1), po = new Date(d.getFullYear(), d.getMonth(), 0); $('#vOd').value = denIso(od); $('#vDo').value = denIso(po); }
    const nez = (V.poMieste[NEZ] || []).length, navrhZak = Object.values(V.vyd).filter(v => v.navrh && v.stav === 'zakaznik').length;
    const porucha = otvoreneUlohy().filter(u => u.typ === 'porucha').length;
    $('#pProblemy').innerHTML = `<div class="list">
      ${nez ? `<button class="item" type="button" data-act="miesto" data-id="${NEZ}"><div class="main"><div class="name">Vrátené – sklad nezistený</div><div class="sub">Vo SPIN je posledný pohyb vrátenie. Sú na Lúke alebo inom sklade VODAXu – pri inventúre naskenovať a zapísať sklad.</div></div><div class="qty"><div class="n">${nez}</div>ks</div></button>` : ''}
      ${p.nezname ? `<button class="item" type="button" data-act="filtrStav" data-stav="nezname"><div class="main"><div class="name">Nezistené</div><div class="sub">Výdajníky bez dokladu (staré nahrávanie) – môžu byť u zákazníkov.</div></div><div class="qty"><div class="n">${p.nezname}</div>ks</div></button>` : ''}
      ${navrhZak ? `<button class="item" type="button" data-act="filtrNavrh"><div class="main"><div class="name">Návrh na vyradenie, ale u zákazníka</div><div class="sub">Poznámka zo SPIN alebo z appky – pri najbližšej návšteve skontrolovať.</div></div><div class="qty"><div class="n">${navrhZak}</div>ks</div></button>` : ''}
      ${porucha ? `<button class="item" type="button" data-act="tab" data-tab="ulohy"><div class="main"><div class="name">Otvorené poruchy u zákazníkov</div><div class="sub">Úlohy typu porucha.</div></div><div class="qty"><div class="n">${porucha}</div></div></button>` : ''}
      </div>${!nez && !p.nezname && !navrhZak && !porucha ? '<div class="empty-state">Nič na doriešenie.</div>' : ''}`;
  }
};

/* VÝDAJNÍKY */
TABS.vydajniky = {nazov:'Výdajníky', limit:80,
  kostra(){
    this.limit = 80;
    const sl = sklady();
    return `<div class="filters">
      <div class="row"><input type="search" id="vQ" placeholder="Výrobné č., evidenčné č. (230/19), model, zákazník…" value="${esc(C.f.vq)}" style="flex:2 1 260px">
        <select id="vMiesto" style="flex:1 1 200px"><option value="">Všetky miesta</option><option value="__zak">Len u zákazníkov</option><option value="__sklady">Len na skladoch</option>${sl.map(s => `<option value="${esc(s.id)}">${esc(s.nazov)}</option>`).join('')}</select>
        <select id="vVlast" style="flex:1 1 150px"><option value="">Naše aj zákaznícke</option><option value="nase">Len naše</option><option value="zak">Len zákaznícke</option></select></div>
      <div class="chips" id="vChips"></div></div>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="note" id="vInfo"></span>
        <span class="row">${jeSanit() ? '<button class="btn small" type="button" data-act="novyVyd">+ Nový výdajník</button>' : ''}${jeSanit() ? '<button class="btn small" type="button" data-act="stitkyFilter">Štítky</button>' : ''}${jeRef() ? '<button class="btn small" type="button" data-act="exportVyd">Excel</button>' : ''}</span></div>
      <div id="vList"></div>`;
  },
  filtrovane(){
    const q = C.f.vq, n = norm(q), id = normVc(q), st = C.f.vstav, mi = C.f.vmiesto, vl = C.f.vvlast;
    return Object.values(V.vyd).filter(v => {
      if (st === 'akt' ? v.stav === 'vyradeny' : st === 'navrh' ? !v.navrh : st && v.stav !== st) return false;
      if (mi === '__zak' ? v.stav !== 'zakaznik' : mi === '__sklady' ? !jeSklad(v.miesto) || v.stav === 'zakaznik' : mi && v.miesto !== mi) return false;
      if (vl === 'nase' && v.vlastnik) return false;
      if (vl === 'zak' && !v.vlastnik) return false;
      if (n && !(v.id.includes(id) || v.ev === id || norm(v.model).includes(n) || norm(nazovMiesta(v.miesto)).includes(n) || norm(v.vlastnik).includes(n))) return false;
      return true;
    });
  },
  obnov(){
    $('#vMiesto').value = C.f.vmiesto; $('#vVlast').value = C.f.vvlast;
    const zakl = Object.values(V.vyd);
    const ch = [['akt','Aktívne', zakl.filter(v => v.stav !== 'vyradeny').length]].concat(Object.keys(STAVY).map(k => [k, STAVY[k], V.pocty[k] || 0]))
      .concat([['navrh','Návrh na vyradenie', zakl.filter(v => v.navrh).length]]);
    $('#vChips').innerHTML = ch.map(([k, l, n]) => `<button class="chip${C.f.vstav === k ? ' on' : ''}" type="button" data-act="vChip" data-k="${k}">${esc(l)}<b>${n}</b></button>`).join('');
    const r = this.filtrovane().sort((a, b) => String(a.odKedy || '9').localeCompare(String(b.odKedy || '9')) || a.id.localeCompare(b.id));
    $('#vInfo').textContent = r.length + ' ' + sk(r.length, 'výdajník', 'výdajníky', 'výdajníkov');
    $('#vList').innerHTML = zoznam(r.slice(0, this.limit), v => itemVyd(v), 'Nič nezodpovedá filtru.') +
      (r.length > this.limit ? `<button class="btn more" type="button" data-act="viac" data-tab="vydajniky">Zobraziť ďalších (${r.length - this.limit})</button>` : '');
  }
};

/* ZÁKAZNÍCI A SKLADY */

/* ÚLOHY */
TABS.ulohy = {nazov:'Úlohy',
  kostra(){
    if (!jeRef()) return `<div class="group"><h2>Na vybavenie</h2><span id="uN"></span></div><div id="uMoje"></div>
      <div class="group"><h2>Hotové dnes</h2></div><div id="uHotove"></div>
      <div class="group"><h2>Moje dnešné záznamy</h2></div><div id="uZaznamy"></div>`;
    const ludia = (SRV.ludia || []).filter(l => l.rola === 'sofer');
    return `<div class="filters"><div class="row">
      <div class="seg" style="flex:1 1 220px"><button type="button" data-act="uFil" data-k="otvorene" class="${C.f.ufil === 'otvorene' ? 'on' : ''}">Otvorené</button><button type="button" data-act="uFil" data-k="hotove" class="${C.f.ufil === 'hotove' ? 'on' : ''}">Hotové</button></div>
      <select id="uPre" style="flex:1 1 180px"><option value="">Všetci šoféri</option><option value="__nikto">Nepriradené</option>${ludia.map(l => `<option>${esc(l.meno)}</option>`).join('')}</select>
      <button class="btn pri small" type="button" data-act="novaUloha">+ Nová úloha</button></div></div><div id="uList"></div>`;
  },
  obnov(){
    if (!jeRef()) {
      const m = mojeUlohy().sort((a, b) => String(a.termin || '9').localeCompare(String(b.termin || '9')) || String(a.vytvorene).localeCompare(String(b.vytvorene)));
      $('#uN').textContent = m.length || '';
      $('#uMoje').innerHTML = zoznam(m, itemUloha, 'Žiadne úlohy. Výdajník nájdete cez Skenovať alebo Hľadať.');
      $('#uHotove').innerHTML = zoznam(Object.values(V.ul).filter(u => u.stav === 'hotova' && jeDnes(u.hotovo) && u.hotovoKto === C.meno), itemUloha, 'Zatiaľ nič.');
      $('#uZaznamy').innerHTML = mojeZaznamy();
      return;
    }
    $('#uPre').value = C.f.upre;
    let r = Object.values(V.ul).filter(u => C.f.ufil === 'otvorene' ? u.stav === 'nova' : u.stav === 'hotova');
    if (C.f.upre === '__nikto') r = r.filter(u => !u.pre); else if (C.f.upre) r = r.filter(u => u.pre === C.f.upre);
    r.sort((a, b) => C.f.ufil === 'otvorene' ? String(a.termin || '9').localeCompare(String(b.termin || '9')) : String(b.hotovo).localeCompare(String(a.hotovo)));
    $('#uList').innerHTML = zoznam(r, itemUloha, C.f.ufil === 'otvorene' ? 'Žiadne otvorené úlohy.' : 'Žiadne hotové úlohy za posledné 2 mesiace.');
  }
};
function mojeZaznamy(){
  const a = Object.values(V.poh).filter(p => p.kto === C.meno && jeDnes(p.cas)).map(p => ({cas:p.cas, h:hrowPohyb(p)}))
    .concat(Object.values(V.ser).filter(s => s.kto === C.meno && jeDnes(s.cas)).map(s => ({cas:s.cas, h:hrowServis(s)})))
    .sort((x, y) => y.cas.localeCompare(x.cas));
  return a.length ? `<div class="hist">${a.map(x => x.h).join('')}</div>` : '<div class="empty-state">Dnes ešte nič.</div>';
}

TABS.sanitacia = {nazov:'Sanitácia',
  kostra(){
    const sl = sklady();
    if (!C.f.sSklad && mojSklad()) C.f.sSklad = mojSklad();
    return `<div class="filters"><select id="sSklad"><option value="">Všetky sklady</option>${sl.map(s => `<option value="${esc(s.id)}">${esc(s.nazov)}</option>`).join('')}</select></div>

      <div class="kpis" id="sKpi" style="margin-top:12px"></div>
      <div class="group"><h2>Čaká na sanitáciu</h2><span id="sN1"></span></div><div id="sCaka"></div>
      <div class="group"><h2>V oprave</h2><span id="sN2"></span></div><div id="sOprava"></div>
      <div class="group"><h2>Dnes hotové</h2><span id="sN3"></span></div><div id="sDnes"></div>`;
  },
  obnov(){
    $('#sSklad').value = C.f.sSklad;
    const sk_ = C.f.sSklad, naSklade = v => !sk_ || v.miesto === sk_;
    const vs = Object.values(V.vyd).filter(naSklade);

      kpi('Z toho moje', sanDnes.filter(s => s.kto === C.meno).length, ''), kpi('Pripravené', vs.filter(v => v.stav === 'pripraveny').length, 'ok'),
      kpi('V oprave', opr.length, 'bad'), kpi('Na vyradenie', vs.filter(v => v.stav === 'vyradenie').length, 'bad')].join('');
    $('#sN1').textContent = caka.length; $('#sN2').textContent = opr.length; $('#sN3').textContent = dnesS.length;
    $('#sCaka').innerHTML = zoznam(caka.slice(0, 60), v => itemVyd(v), 'Nič nečaká.');
    $('#sOprava').innerHTML = zoznam(opr, v => itemVyd(v), 'Nič v oprave.');
    $('#sDnes').innerHTML = dnesS.length ? `<div class="hist">${dnesS.map(hrowServis).join('')}</div>` : '<div class="empty-state">Dnes ešte nič.</div>';
  }
};

/* SERVIS – rovnaký postup ako vo Flex Mobility: výdajník → karta + história → Záznam servisu → výber činnosti → popis */
const SERVIS = {id:'', zoSanit:false, hist:null, histPre:'', zaznam:false, kod:'', popis:'', diely:'', vysledok:'opraveny', dovod:'', variant:'bezna', kroky:{}, firma:'', sprava:'', dielyZoz:[], dielNovy:''};
// [kód, typ na serveri, názov, druh zásahu]
const CINNOSTI = [['O', 'oprava', 'Oprava – interná', 'Interná'], ['OC', 'oprava', 'Oprava – chladiarenská', 'Chladiarenská'], ['R', 'revizia', 'Revízia – elektrická', 'Elektrická'],
  ['S', 'sanitacia', 'Sanitácia'], ['N', 'navrh', 'Návrh na vyradenie'], ['P', 'porucha', 'Hlásenie poruchy']];
function otvorServis(id){
  Object.assign(SERVIS, {id, zoSanit:false, hist:null, histPre:'', zaznam:false, kod:'', popis:'', diely:'', vysledok:'opraveny', dovod:'', variant:'bezna', kroky:{}, firma:'', sprava:'', dielyZoz:[], dielNovy:''});
  C.tab = 'servis'; ulozConf(); zavriModal(); vykresli(); window.scrollTo(0, 0);
}
function servisRiadky(v){
  const r = [];
  const lok = Object.values(V.ser).filter(x => x.vyd === v.id);
  const cela = SERVIS.histPre === v.id && SERVIS.hist ? SERVIS.hist.servis : [];
  const vid = new Set();
  for (const x of cela.concat(lok)) { if (vid.has(x.id)) continue; vid.add(x.id); r.push({cas:x.cas, cin:nazovServisu(x), popis:[VYSLEDKY[x.vysledok] || x.vysledok, rozdelPopis(x).popis, x.diely ? 'súčiastky: ' + x.diely : ''].filter(Boolean).join(' · '), kto:x.kto, cak:x.cak}); }
  // posledné záznamy zo SPIN (technik vo zostave nie je)
  let spin = {}; try { spin = v.spin ? JSON.parse(v.spin) : {}; } catch(e) {}
  for (const [k, l] of [['sanitacia', 'Sanitácia'], ['oprava', 'Oprava'], ['revizia', 'Revízia']]) {
    const d = v[k]; if (!d || r.some(x => String(x.cas).slice(0, 10) === String(d).slice(0, 10) && x.cin === l)) continue;
    if (r.some(x => !x.spin && (x.cas === d || (String(x.cas).slice(0, 10) === String(d).slice(0, 10) && x.cin.startsWith(l))))) continue;
    r.push({cas:d, cin:l, popis:k === 'oprava' && spin.Popis ? spin.Popis.split('\n').pop() : '', kto:'SPIN', spin:true});
  }
  return r.sort((a, b) => String(b.cas).localeCompare(String(a.cas)));
}
TABS.servis = {nazov:'Servis',

      <div class="fxbox"><label class="small muted" for="srvVyd" style="display:block;margin-bottom:6px">Výdajník</label>
      <div class="vinput"><input type="text" id="srvVyd" placeholder="výrobné číslo alebo evidenčné (230/19)" autocomplete="off" value="${esc(SERVIS.id ? (V.vyd[SERVIS.id] || {}).vc || SERVIS.id : '')}">
      <button class="btn" type="button" data-act="servisHladaj">OK</button><button class="iconbtn" type="button" data-act="skenServis" aria-label="Skenovať">${svg('qr')}</button></div></div></div>
    <div id="srvKarta" style="margin-top:12px"></div>`,
  obnov(){

    if (SERVIS.zaznam) {

          <button class="btn small" type="button" data-act="srvVsetko" style="margin-top:6px">Označiť všetko</button>`;
      } else if (c && c[1] === 'oprava') {
        const zoz = SERVIS.dielyZoz;
        extra = `<div class="seg"><button type="button" data-act="srvVys" data-k="opraveny" class="${SERVIS.vysledok === 'opraveny' ? 'on' : ''}">Opravený</button><button type="button" data-act="srvVys" data-k="caka" class="${SERVIS.vysledok === 'caka' ? 'on' : ''}">Čaká na diel / servis</button></div>
          ${SERVIS.kod === 'OC' ? `<div class="fld"><label for="srvFirma">Kto opravoval (chladiarenská firma / technik)</label><input type="text" id="srvFirma" data-sp="firma" value="${esc(SERVIS.firma)}" autocomplete="off"></div>` : ''}
          <div class="fld"><label>Vymenené súčiastky</label>

              <button class="btn small" type="button" data-act="srvDielKs" data-i="${i}" data-k="1" aria-label="Viac">+</button>
              <button class="btn small danger" type="button" data-act="srvDielZmaz" data-i="${i}" aria-label="Odstrániť">✕</button></div>`).join('')}</div>`
              : '<div class="muted small">Ťuknite na súčiastku nižšie (posúvajte do strany) alebo napíšte inú. Ak sa nič nemenilo, nechajte prázdne.</div>'}
            <div class="chips" style="margin-top:8px">${dielyNavrh().map(n => `<button class="chip" type="button" data-act="srvDiel" data-k="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>
            <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input type="text" id="srvDielNovy" data-sp="dielNovy" value="${esc(SERVIS.dielNovy)}" placeholder="iná súčiastka (názov, kód)" autocomplete="off"><button class="btn small" type="button" data-act="srvDielPridaj">Pridať</button></div>
          </div>`;
      } else if (SERVIS.kod === 'R') {
        extra = `<div class="seg"><button type="button" data-act="srvVys" data-k="vyhovuje" class="${SERVIS.vysledok === 'vyhovuje' ? 'on' : ''}">Vyhovuje</button><button type="button" data-act="srvVys" data-k="nevyhovuje" class="${SERVIS.vysledok === 'nevyhovuje' ? 'on' : ''}">Nevyhovuje</button></div>
          <div class="fld"><label for="srvSprava">Číslo revíznej správy</label><input type="text" id="srvSprava" data-sp="sprava" value="${esc(SERVIS.sprava)}" autocomplete="off"></div>
          <div class="fld"><label for="srvFirma">Revízny technik</label><input type="text" id="srvFirma" data-sp="firma" value="${esc(SERVIS.firma)}" autocomplete="off"></div>`;
      } else if (SERVIS.kod === 'N') {
        extra = `<div class="row">${DOVODY.map(d => `<button class="chip${SERVIS.dovod === d ? ' on' : ''}" type="button" data-act="srvDovod" data-k="${esc(d)}">${esc(d)}</button>`).join('')}</div>`;
      }
      const ok = SERVIS.kod && (SERVIS.kod !== 'S' || (SERVIS.variant === 'novy' ? KROKY_NOVY : KROKY_SANIT).every((_, i) => SERVIS.kroky[SERVIS.variant + i]));
      zaz = `<div class="fxs">Výber činnosti</div>
        <table class="vyber"><thead><tr><th style="width:70px">Kód</th><th>Názov činnosti</th></tr></thead><tbody>
        ${kody.map(([k, , l]) => `<tr data-act="srvKod" data-k="${k}" class="${SERVIS.kod === k ? 'on' : ''}"><td><b>${k}</b></td><td>${esc(l)}</td></tr>`).join('')}</tbody></table>

          <button class="btn ok big" type="button" data-act="srvUloz" ${ok ? '' : 'disabled'}>Uložiť – ${esc(c ? c[2] : '')}</button>

        ${r('Vlastník', v.vlastnik ? 'zákazník – ' + v.vlastnik : 'náš')}${r('Dátum zaradenia', fmtD(v.zaradenie))}${r('Dátum vyradenia', fmtD(v.vyradenie))}${r('Poznámka', v.pozn)}

function servisNajdi(text){
  const r = najdiVyd(text);
  if (r.length === 1) { otvorServis(r[0].id); return true; }
  toast(r.length ? 'Viac zhôd – napíšte celé číslo.' : 'Nenašiel som: ' + text, 3000);
  return false;
}
function servisUloz(){
  const c = CINNOSTI.find(x => x[0] === SERVIS.kod); if (!c) return;
  const popis = SERVIS.popis.trim();
  const jeOpr = c[1] === 'oprava';
  if (SERVIS.kod === 'P' && !popis) return toast('Napíšte, čo nefunguje.');
  if (jeOpr && !popis && !SERVIS.dielyZoz.length) return toast('Napíšte poznámku alebo pridajte vymenenú súčiastku.');
  if (SERVIS.kod === 'N' && !SERVIS.dovod) return toast('Vyberte dôvod.');
  if ((SERVIS.dielNovy || '').trim()) return toast('Súčiastku v políčku ešte pridajte tlačidlom „Pridať“ (alebo políčko vymažte).', 3500);
  const casti = [];
  if (SERVIS.sprava.trim()) casti.push('správa č. ' + SERVIS.sprava.trim());
  if (SERVIS.firma.trim()) casti.push((c[1] === 'revizia' ? 'technik: ' : 'opravoval: ') + SERVIS.firma.trim());
  if (popis) casti.push(popis);
  const text = (c[3] ? '[' + c[3] + '] ' : '') + casti.join(' · ');
  const vys = SERVIS.kod === 'S' ? (SERVIS.variant === 'novy' ? 'nový – kontrola' : 'kompletná') : jeOpr || c[1] === 'revizia' ? SERVIS.vysledok : SERVIS.kod === 'N' ? SERVIS.dovod : '';
  const diely = jeOpr ? SERVIS.dielyZoz.map(x => x.n + ' ' + x.ks + '×').join('; ') : '';
  zmen({t:'servis', vyd:SERVIS.id, typ:c[1], vysledok:vys, popis:text, diely});
  vibr(); toast(c[1] === 'revizia' && vys === 'nevyhovuje' ? 'Uložené – výdajník nevyhovel, zapíšte opravu alebo návrh na vyradenie.' : 'Uložené: ' + c[2], 3500);
  if (SERVIS.zoSanit && SERVIS.kod === 'S') setTimeout(() => ACT.skenSanit(), 400);
  Object.assign(SERVIS, {zaznam:false, kod:'', popis:'', diely:'', vysledok:'opraveny', dovod:'', variant:'bezna', kroky:{}, firma:'', sprava:'', dielyZoz:[], dielNovy:''});
  TABS.servis.obnov();
}
$('#main').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sp) SERVIS[t.dataset.sp] = t.value;
  if (t.dataset.krok) { SERVIS.kroky[t.dataset.krok] = t.checked; TABS.servis.obnov(); }
});
$('#main').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'srvVyd') { e.preventDefault(); servisNajdi(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'srvDielNovy') { e.preventDefault(); ACT.srvDielPridaj(); }
});
function pridajDiel(n){
  n = String(n || '').replace(/[;×]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); if (!n) return;
  const x = SERVIS.dielyZoz.find(d => d.n.toLowerCase() === n.toLowerCase());
  if (x) x.ks++; else SERVIS.dielyZoz.push({n, ks:1});
  TABS.servis.obnov();
}

/* RÝCHLY VÝDAJ / ZVOZ bez úlohy: zákazník (pri výdaji) alebo sklad (pri zvoze) + skenovanie viacerých kusov */
function vRychly(typ){
  return {ziva:true, st:{typ, miesto:'', kam:mojSklad(), vc:'', zapisane:[], ids:[]},
    hlavicka: st => ({nazov: st.typ === 'vydaj' ? 'Výdaj zákazníkovi' : rola() === 'sanitar' ? 'Príjem na sklad' : 'Zvoz od zákazníka', sub:'naskenujte každý kus'}),
    telo(st){
      const m = miesto(st.miesto);
      const kde = st.typ === 'vydaj'
        ? `<div class="fld"><label>Zákazník</label>${m ? `<div class="item"><div class="main"><div class="name">${esc(m.nazov)}</div><div class="sub">${esc([m.adresa, m.mesto].filter(Boolean).join(', '))} · teraz ${(V.poMieste[m.id] || []).filter(v => v.stav === 'zakaznik').length} ks</div></div><button class="btn small" type="button" data-act="vyberMiesto" data-typ="zakaznik" data-pole="miesto">Zmeniť</button></div>`
          : '<button class="btn pri" type="button" data-act="vyberMiesto" data-typ="zakaznik" data-pole="miesto" style="width:100%">Vybrať zákazníka</button>'}</div>`
        : `<div class="fld"><label>Prevzaté idú na sklad</label>${fSel('kam', st, skladyOpts(true), '— vyberte sklad —')}</div>`;
      const pripraveny = st.typ === 'vydaj' ? !!st.miesto : !!st.kam;
      return `${kde}
        <button class="btn pri big" type="button" data-act="rychlySken" ${pripraveny ? '' : 'disabled'}>${svg('qr')}Skenovať výdajníky</button>
        <div class="row" style="flex-wrap:nowrap"><input type="text" ${fIn('vc', st, 'placeholder="alebo napíšte číslo" autocomplete="off"')}><button class="btn small" type="button" data-act="rychlyRucne" ${pripraveny ? '' : 'disabled'}>Zapísať</button></div>
        ${st.zapisane.length ? `<div><b>Zapísané teraz (${st.zapisane.length})</b><div class="rychly-list" style="margin-top:8px">${st.zapisane.map(x => `<div class="hrow"><div class="t">${esc(x)}</div></div>`).join('')}</div></div>` : ''}
        ${st.ids.length ? '<button class="btn" type="button" data-act="podpisRychly">✍ Podpis zákazníka (voliteľné)</button>' : ''}
        <p class="note" style="margin:0">Každý kus sa hneď zapíše (aj bez signálu – odošle sa neskôr). Pri zákazníkovi s úlohou použite radšej úlohu.</p>`;
    }
  };
}
function pohybRychly(st, text){
  const typ = st.typ, r = najdiVyd(text);
  if (!r.length) return {msg:'Nenašiel som: ' + text};
  if (r.length > 1) return {msg:'Viac zhôd pre ' + text + ' – napíšte celé číslo.'};
  const v = r[0];
  // vyradený kus sa nesmie vrátiť do obehu; v oprave / na vyradenie nevydávať
  if (v.stav === 'vyradeny') return {msg:v.vc + ' je VYRADENÝ – nevydávať ani neprijímať, odložte ho bokom a dajte vedieť referentke.'};
  if ((typ === 'vydaj') && (v.stav === 'oprava' || v.stav === 'vyradenie')) return {msg:v.vc + ' je ' + STAVY[v.stav].toLowerCase() + ' – nevydávajte ho, vezmite iný kus.'};
  if (st.typ === 'vydaj') {
    if (v.stav === 'zakaznik' && v.miesto === st.miesto) return {msg:v.vc + ' už je u tohto zákazníka.'};
    const op = {t:'pohyb', vyd:v.id, typ:'vydaj', kam:st.miesto}; zmen(op); st.ids.push(op.id);
  } else {
    if (SKLADOVE.includes(v.stav) && v.miesto === st.kam) return {msg:v.vc + ' už je na tomto sklade.'};
    const op = {t:'pohyb', vyd:v.id, typ:'prijem', kam:st.kam}; zmen(op); st.ids.push(op.id); if (!st.miesto && v.stav === 'zakaznik') st.miesto = v.miesto;
    if (!C.sklad) { C.sklad = st.kam; ulozConf(); }
  }
  vibr();
  const msg = (st.typ === 'vydaj' ? 'Vydané: ' : 'Prevzaté: ') + v.vc + ' · ' + v.model + (st.typ === 'vydaj' && v.stav === 'spinavy' ? ' (pozor – bol na sanitáciu)' : '') + (st.typ === 'prijem' && v.stav === 'zakaznik' ? ' (od ' + nazovMiesta(v.miesto) + ')' : '');
  st.zapisane.unshift(msg);
  return {ok:true, msg};
}

/* QR ŠTÍTKY pre Brother P-touch (páska 36 mm) – obrázok 62 × 36 mm pri 300 dpi */
const qrText = v => v.ev ? jadro(v.id) + '  ' + v.ev : (v.vc || v.id);   // rovnaký tvar ako štítky VODAXu: „VČ  poradové/rok“
function stitokObrazok(v){
  const W = 732, H = 425, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const d = document.createElement('div'); new QRCode(d, {text:qrText(v), width:340, height:340, correctLevel:QRCode.CorrectLevel.M});
  const q = d.querySelector('canvas'); if (q) x.drawImage(q, 28, 42, 340, 340);
  x.fillStyle = '#000'; x.textBaseline = 'top';
  // text sa radšej zmenší, až potom skráti
  const riadok = (t, y, px, tucne) => { let s = String(t || ''), v = px; const f = () => (tucne ? 'bold ' : '') + v + 'px Arial';
    x.font = f(); while (v > 24 && x.measureText(s).width > 330) { v -= 2; x.font = f(); }
    while (s && x.measureText(s).width > 330) s = s.slice(0, -1); x.fillText(s, 392, y); };
  let y = 52;
  riadok(jadro(v.id), y, 54, true); y += 70;
  if (v.ev) { riadok('ev. č. ' + v.ev, y, 46, true); y += 74; } else y += 10;
  const m = String(v.model || '').split(' '), r1 = [], r2 = [];
  x.font = '34px Arial';
  for (const w of m) { if (!r2.length && x.measureText(r1.concat(w).join(' ')).width <= 330) r1.push(w); else r2.push(w); }
  riadok(r1.join(' '), y, 34); if (r2.length) { riadok(r2.join(' '), y + 40, 34); y += 40; }
  riadok(v.vlastnik ? 'vlastník: ' + v.vlastnik : 'Lucka · BUDIŠ a. s.', Math.max(y + 82, 318), 30);
  return c.toDataURL('image/png');
}
function vStitky(ids){
  return {st:{ids},
    hlavicka: st => ({nazov:'QR štítky', sub:st.ids.length + ' ks · páska 36 mm (Brother P-touch)'}),
    telo(st){
      if (!window.QRCode) return '<div class="warnbox">Knižnica na QR kódy sa ešte načítava – skúste o chvíľu.</div>';
      st.obr = st.obr || st.ids.map(id => V.vyd[id]).filter(Boolean).map(v => ({id:v.id, png:stitokObrazok(v)}));
      return `<div class="stitky">${st.obr.map(o => `<img src="${o.png}" alt="Štítok ${esc(o.id)}">`).join('')}</div>
        ${navigator.canShare && /Android|iPhone|iPad|Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 0 ? '<button class="btn pri big" type="button" data-act="stitkyZdielaj">Tlačiť cez Brother (tablet / mobil)</button>' : ''}
        <div class="actions two"><button class="btn${navigator.maxTouchPoints > 0 ? '' : ' pri'}" type="button" data-act="stitkyTlac">Tlačiť</button><button class="btn" type="button" data-act="stitkyPng">Stiahnuť obrázky (PNG)</button></div>
        <p class="note" style="margin:0">Tlač: v okne tlače vyberte tlačiareň Brother a pásku 36 mm. Alebo stiahnite obrázky a vložte ich do P-touch Editora. Štítok nalepte vedľa výrobného štítku – QR prečíta aplikácia aj Flex.</p>`;
    }
  };
}
/** Ďalšie voľné evidenčné číslo v tomto roku (napr. 88/26). */
function navrhniEv(){
  const yy = String(new Date().getFullYear()).slice(2);
  let max = 0;
  for (const v of Object.values(V.vyd)) { const m = String(v.ev || '').match(/^(\d+)\/(\d+)$/); if (m && m[2] === yy) max = Math.max(max, +m[1]); }
  return (max + 1) + '/' + yy;
}

/* PODPIS ZÁKAZNÍKA (voliteľný) – pri úlohe alebo pri rýchlom výdaji / zvoze */
function vPodpis(o){
  return {st:{meno:'', ciary:0}, o,
    hlavicka: () => ({nazov:'Podpis zákazníka', sub:esc(nazovMiesta(o.miesto)) + ' · ' + o.pohyby.length + ' ' + sk(o.pohyby.length, 'výdajník', 'výdajníky', 'výdajníkov')}),
    telo: st => `<div class="note" style="margin:0">Zákazník sa podpíše prstom do bieleho poľa. Podpis je voliteľný.</div>
      <canvas class="podpis-plocha" id="podpisPlocha"></canvas>
      <div class="fld"><label for="podpisMeno">Meno podpisujúceho</label><input type="text" id="podpisMeno" ${fIn('meno', st, 'autocomplete="off"')}></div>
      <div class="actions two"><button class="btn" type="button" data-act="podpisVymaz">Vymazať</button><button class="btn ok" type="button" data-act="podpisUloz">Uložiť podpis</button></div>`,
    po(st){
      const c = $('#podpisPlocha'), r = c.getBoundingClientRect();
      c.width = Math.round(r.width); c.height = Math.round(r.height);
      const x = c.getContext('2d'); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0b1d33';
      let kreslim = false;
      const bod = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      c.onpointerdown = e => { kreslim = true; c.setPointerCapture(e.pointerId); const [a, b] = bod(e); x.beginPath(); x.moveTo(a, b); st.ciary++; };
      c.onpointermove = e => { if (!kreslim) return; const [a, b] = bod(e); x.lineTo(a, b); x.stroke(); };
      c.onpointerup = c.onpointercancel = () => { kreslim = false; };
    }
  };
}

      } else if (st.typ === 'oprava') {
        h += `<div class="fld"><label>Čo bolo pokazené a čo sa urobilo</label><textarea ${'data-f="popis"'}>${esc(st.popis)}</textarea></div>

          <button class="btn pri" type="button" data-act="ulozServis">Uložiť opravu</button>`;
      } else if (st.typ === 'navrh') {
        h += `<div class="fld"><label>Dôvod</label><div class="row">${DOVODY.map(d => `<button class="chip${st.dovod === d ? ' on' : ''}" type="button" data-act="sDovod" data-k="${esc(d)}">${esc(d)}</button>`).join('')}</div></div>
          <div class="fld"><label>Popis</label><input type="text" ${fIn('popis', st, 'placeholder="napr. oprava chladenia nad 200 €"')}></div>
          <p class="note" style="margin:0">Výdajník sa odloží do stavu „Na vyradenie“. Vyradiť z evidencie ho môže referentka.</p>
          <button class="btn pri" type="button" data-act="ulozServis">Uložiť návrh</button>`;
      } else if (st.typ === 'vyradenie') {
        h += `<div class="warnbox">Výdajník sa vyradí z evidencie (stav Vyradený). Robí sa po schválení vyradenia.</div>
          <div class="fld"><label>Dôvod / číslo protokolu o vyradení</label><input type="text" ${fIn('popis', st)}></div>
          <button class="btn pri" type="button" data-act="ulozServis">Vyradiť</button>`;
      } else {
        const l = {revizia:'Číslo revíznej správy, technik', porucha:'Čo nefunguje', zrusNavrh:'Prečo sa návrh ruší'}[st.typ] || 'Popis';
        h += `<div class="fld"><label>${esc(l)}</label><input type="text" ${fIn('popis', st)}></div>
          <button class="btn pri" type="button" data-act="ulozServis">Uložiť</button>`;
      }
      return h;
    },
    zmena(f, st){ if (f.startsWith('k_')) { st.kroky[f.slice(2)] = st[f]; renderModal(); } }
  };
}
function ulozServis(st){
  let popis = st.popis.trim(), vys = '';
  if (st.typ === 'sanitacia') { vys = st.variant === 'novy' ? 'nový – kontrola' : 'kompletná'; }
  if (st.typ === 'oprava') { if (!popis) return toast('Popíšte opravu.'); vys = st.vysledok; }
  if (st.typ === 'navrh') { if (!st.dovod) return toast('Vyberte dôvod.'); vys = st.dovod; }
  if (st.typ === 'porucha' && !popis) return toast('Popíšte poruchu.');
  zmen({t:'servis', vyd:st.id, typ:st.typ, vysledok:vys, popis, diely:(st.diely || '').trim()});
  vibr(); toast('Uložené: ' + TYPY_SERVISU[st.typ]);
  if (SKEN.rezim === 'sanit' && st.typ === 'sanitacia') { zavriModal(); setTimeout(() => ACT.skenSanit(), 250); return; }
  SKEN.rezim = '';
  spat();
}

/** Riadky zostavy SPIN → výdajníky a miesta pre aplikáciu. */
function spinNaZaznamy(riadky){
  const ix = {}; (riadky[0] || []).forEach((h, i) => { ix[String(h).trim()] = i; });
  if (ix.VYROBNE_CISLO == null || ix.OM_FIRMA_INT_KOD == null) throw new Error('V súbore chýbajú stĺpce VYROBNE_CISLO / OM_FIRMA_INT_KOD – je to zostava „Výdajníky (dump)“?');
  const g = (r, k) => { const v = r[ix[k]]; return v == null ? '' : v; };
  const s = (r, k) => String(g(r, k)).replace(/\s+$/, '').trim();
  const d = (r, k) => { const v = g(r, k); if (!v) return ''; const x = v instanceof Date ? v : new Date(v); if (isNaN(x)) return ''; if (x.getFullYear() > new Date().getFullYear() + 1) return ''; return x.toISOString(); };
  const den = (r, k) => { const v = d(r, k); return v ? denIso(v) : ''; };
  const miesta = {}, vyd = {}, suhrn = {riadkov:riadky.length - 1, st:{}, vlastne:0, dup:0};
  miesta[NEZ] = {id:NEZ, typ:'sklad', nazov:'Vrátené – sklad nezistený', pozn:'Vo SPIN je posledný pohyb vrátenie od zákazníka. Podľa VODAXu sú na Lúke alebo na inom ich sklade, odkiaľ sa vozia na Lúku na sanitáciu. Pri inventúre zapísať skutočný sklad.'};
  miesta[NOVE] = {id:NOVE, typ:'sklad', nazov:'Nové 2026 – Lúka alebo BA', pozn:'Výdajníky zaradené v roku 2026 bez dokladu. Podľa VODAXu nové kusy na predaj alebo po revízii čakajúce na umiestnenie, na sklade Lúka alebo v BA. Pri inventúre zapísať skutočný sklad.'};
  const jeSkladOM = n => /vodax/i.test(n);
  // „predaný / predaj“ v popise alebo poznámke = podľa VODAXu patrí zákazníkovi (nie „nepredaný“, „predný“)
  const PREDANY = /(^|[^a-záäčďéíĺľňóôŕšťúýž])preda(n|ň|j)/i;
  for (const r of riadky.slice(1)) {
    const vc = s(r, 'VYROBNE_CISLO'); if (!vc) continue;
    const om = s(r, 'OM_FIRMA_INT_KOD'), omN = s(r, 'OM_FIRMA_NAZOV');
    if (om && !miesta[om]) miesta[om] = {id:om, typ:jeSkladOM(omN) ? 'sklad' : 'zakaznik', nazov:omN || om, ico:s(r, 'OM_FIRMA_ICO'), adresa:s(r, 'OM_FIRMA_ADRESA'),
      psc:s(r, 'OM_FIRMA_PSC'), mesto:s(r, 'OM_FIRMA_MESTO'), fakt:s(r, 'FM_FIRMA_NAZOV'), faktIco:s(r, 'FM_FIRMA_ICO'),
      faktAdresa:[s(r, 'FM_FIRMA_ADRESA'), [s(r, 'FM_FIRMA_PSC'), s(r, 'FM_FIRMA_MESTO')].filter(Boolean).join(' ')].filter(Boolean).join(', ')};
    else if (om && !miesta[om].fakt && s(r, 'FM_FIRMA_NAZOV')) Object.assign(miesta[om], {fakt:s(r, 'FM_FIRMA_NAZOV'), faktIco:s(r, 'FM_FIRMA_ICO')});
    const nazov = s(r, 'NAZOV_VYDAJNIKA'), mn = num(g(r, 'DOKLAD_MNOZSTVO')), dokl = d(r, 'DOKLAD_DATUM'), san = d(r, 'POSLEDNA_SANITACIA');
    const vlastnikTxt = s(r, 'VLASTNIK_NAZOV_FIRMY').replace(/^Firma\s*:\s*/i, '').replace(/,?\s*IČO:.*$/i, '').trim();
    const predany = PREDANY.test(s(r, 'POPIS') + ' ' + s(r, 'POZNAMKA'));
    const vlastnik = vlastnikTxt || (predany ? (mn === 1 && omN && !jeSkladOM(omN) ? omN : 'predaný (podľa poznámky v SPIN)')
      : /vlastn/i.test(s(r, 'NAZOV_PRODUKTU') + ' ' + nazov) ? 'zákazník' : '');
    const rokM = nazov.match(/\b(20\d{2}|19\d{2})\b/), zar = den(r, 'DATUM_ZARADENIA');
    let stav, miestoId = '', pozn = '';
    if (g(r, 'DATUM_VYRADENIA')) { stav = 'vyradeny'; miestoId = om; if (mn === 1) pozn = 'Výdaj po vyradení je vo SPIN len oprava obalového konta (VODAX).'; }
    else if (mn === 1) { miestoId = om; stav = miesta[om] && miesta[om].typ === 'sklad' ? 'pripraveny' : 'zakaznik'; }
    else if (mn === -1) { miestoId = NEZ; stav = san && san > dokl ? 'pripraveny' : 'spinavy'; }
    else if (zar.slice(0, 4) === '2026') { miestoId = NOVE; stav = 'pripraveny'; }
    else { stav = 'nezname'; pozn = 'Bez dokladu v SPIN – podľa VODAXu nahraté starým spôsobom, môže byť u zákazníka.'; }
    if (predany) pozn = (pozn ? pozn + ' ' : '') + 'Predaný – nie je majetkom VODAXu, patrí zákazníkovi.';
    // návrh na vyradenie zo SPIN je podľa VODAXu len poznámka pre sanitáciu – stav nemení
    const navrh = s(r, 'NAVRH_NA_VYRADENIE');
    const spin = {};
    const pridaj = (l, x) => { if (x !== '' && x != null) spin[l] = x; };
    if (om) pridaj('Posledný doklad', `${s(r, 'DOKLAD_CISLO')} z ${fmtD(den(r, 'DOKLAD_DATUM'))}, ${mn > 0 ? 'výdaj' : 'vrátenie'} ${mn > 0 ? 'do' : 'z'} ${omN}`);
    pridaj('Cena na doklade', s(r, 'DOKLAD_CENA') && s(r, 'DOKLAD_CENA') !== '0' ? s(r, 'DOKLAD_CENA') : '');
    pridaj('Cenník 40', s(r, 'CENNIK_40_CENA'));
    pridaj('Typ', s(r, 'NAZOV_TYPU'));
    pridaj('Popis', s(r, 'POPIS').replace(/_x000D_/g, '').replace(/\r+\n?/g, '\n').trim());
    pridaj('Poznámka', s(r, 'POZNAMKA').replace(/^[Š♦\s]+/, '').replace(/\r+\n?/g, '\n').trim());
    pridaj('Kód produktu', s(r, 'KOD_PRODUKTU'));
    pridaj('Vlastník vo SPIN', s(r, 'VLASTNIK_NAZOV_FIRMY'));
    const id = normVc(vc);
    if (vyd[id]) suhrn.dup++;
    vyd[id] = {vc:id, ev:(vc.match(/(\d{1,5}\/\d{2,4})\s*$/) || [])[1] || '', nazov, model:nazov.replace(/^V[ýy]dajn[íi]k\s*/i, ''), rok:rokM ? rokM[1] : zar.slice(0, 4),
      vlastnik, obstCena:s(r, 'OBSTARAVACIA_CENA'), zaradenie:zar, vyradenie:den(r, 'DATUM_VYRADENIA'), stav, miesto:miestoId, odKedy:dokl,
      sanitacia:san, oprava:d(r, 'POSEDNA_OPRAVA') || d(r, 'POSLEDNA_OPRAVA'), revizia:d(r, 'POSLEDNA_REVIZIA'), navrh, pozn, spin:JSON.stringify(spin), predany};
  }
  const v = Object.values(vyd), m = Object.values(miesta);
  suhrn.predane = 0;
  for (const x of v) { suhrn.st[x.stav] = (suhrn.st[x.stav] || 0) + 1; if (x.vlastnik) suhrn.vlastne++; if (x.predany && x.stav !== 'vyradeny') suhrn.predane++; delete x.predany; }
  Object.assign(suhrn, {vyd:v.length, zak:m.filter(x => x.typ === 'zakaznik').length, skl:m.filter(x => x.typ === 'sklad').length});
  return {vydajniky:v, miesta:m, suhrn};
}

/** Výdaj / prevzatie v rámci úlohy (sken alebo ručne). */
function pohybKUlohe(st, typ, text){
  const u = V.ul[st.id]; if (!u) return {msg:'Úloha neexistuje.'};
  const r = najdiVyd(text);
  if (!r.length) return {msg:'Nenašiel som: ' + text};
  if (r.length > 1) return {msg:'Viac zhôd pre ' + text + ' – napíšte celé číslo.'};
  const v = r[0];
  // vyradený kus sa nesmie vrátiť do obehu; v oprave / na vyradenie nevydávať
  if (v.stav === 'vyradeny') return {msg:v.vc + ' je VYRADENÝ – nevydávať ani neprijímať, odložte ho bokom a dajte vedieť referentke.'};
  if ((typ === 'vydaj') && (v.stav === 'oprava' || v.stav === 'vyradenie')) return {msg:v.vc + ' je ' + STAVY[v.stav].toLowerCase() + ' – nevydávajte ho, vezmite iný kus.'};
  if (typ === 'vydaj') {
    if (v.stav === 'zakaznik' && v.miesto === u.miesto) return {msg:v.vc + ' už je u tohto zákazníka.'};
    zmen({t:'pohyb', vyd:v.id, typ:'vydaj', kam:u.miesto, uloha:u.id});
    vibr(); return {ok:true, msg:'Vydané: ' + v.vc + (v.stav === 'spinavy' ? ' (pozor – bol na sanitáciu)' : '')};
  }
  if (!st.kam) return {msg:'Vyberte sklad pre prevzaté výdajníky.'};
  const inde = v.stav === 'zakaznik' && v.miesto !== u.miesto;
  zmen({t:'pohyb', vyd:v.id, typ:'prijem', kam:st.kam, uloha:u.id});
  if (!C.sklad) { C.sklad = st.kam; ulozConf(); }
  vibr(); return {ok:true, msg:'Prevzaté: ' + v.vc + (inde ? ' (v evidencii bol u ' + nazovMiesta(v.miesto) + ')' : '')};
}

/* ---------- skenovanie ---------- */
/** Fotka zo súboru ako obrázok na kreslenie – createImageBitmap nie je na iOS starších ako 15. */
function obrazok(subor){
  if (window.createImageBitmap) return createImageBitmap(subor);
  return new Promise((ok, ko) => { const i = new Image(), u = URL.createObjectURL(subor); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => ko(new Error('Fotka sa nedá otvoriť.')); i.src = u; });
}
const SKEN = {stream:null, bezi:false, rezim:'', kod:null};
/** Živá kamera ide len mimo rámčeka Google (lokálny test) alebo tam, kde ju rámček výslovne povolí. Inak sa skenuje fotkou. */
const ZIVA_KAMERA = (() => {
  try { if (window.top === window.self) return true; } catch(e) {}
  try { return !!(document.featurePolicy && document.featurePolicy.allowsFeature('camera')); } catch(e) { return false; }
})();
async function detektor(max){
  if ('BarcodeDetector' in window) {
    try { const f = await BarcodeDetector.getSupportedFormats(); if (f && f.length) { const d = new BarcodeDetector({formats:f}); return src => d.detect(src); } } catch(e) {}
  }
  if (window.jsQR) return async src => {
    const c = detektor.c || (detektor.c = document.createElement('canvas'));
    const w = src.videoWidth || src.width, h = src.videoHeight || src.height; if (!w) return [];
    const k = Math.min(1, (max || 1000) / Math.max(w, h)); c.width = Math.round(w * k); c.height = Math.round(h * k);
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(src, 0, 0, c.width, c.height);
    const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    return r ? [{rawValue:r.data, format:'qr_code'}] : [];
  };
  return null;
}
function spracujKod(t, format){
  if (kodVyrobku(format)) { $('#scanMsg').textContent = 'EAN výrobku preskočený – namierte na QR kód'; return; }
  const r = SKEN.kod(t) || {};
  if (r.msg) $('#scanMsg').textContent = r.msg;
}
async function spustiSken(o){
  SKEN.rezim = o.rezim; SKEN.kod = o.kod;
  $('#scanMsg').textContent = o.text || 'Namierte na QR kód';
  $('#scanRucne').value = '';
  $('#scan').classList.toggle('foto-rezim', !ZIVA_KAMERA);
  $('#scanFoto').textContent = 'Odfotiť kód';
  $('#scan').classList.add('on'); SKEN.bezi = true;
  if (!ZIVA_KAMERA) { $('#skenVstup').value = ''; $('#skenVstup').click(); return; }   // fotoaparát sa musí otvoriť hneď v rámci ťuknutia
  const det = await detektor();
  try {
    if (!det) throw new Error('bez detektora');
    SKEN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}}});
    const v = $('#scanVideo'); v.srcObject = SKEN.stream; await v.play();
    let posledne = '', kedy = 0;
    const krok = async () => {
      if (!SKEN.bezi) return;
      try {
        for (const k of await det(v)) {
          const t = String(k.rawValue || '').trim();
          if (t && (t !== posledne || Date.now() - kedy > 3000)) { posledne = t; kedy = Date.now(); spracujKod(t, k.format); if (!SKEN.bezi) return; }
        }
      } catch(e) {}
      setTimeout(krok, 220);
    };
    krok();
  } catch(e) {
    $('#scanMsg').textContent = 'Kamera sa nespustila – použite „Odfotiť kód“ alebo napíšte číslo.';
  }
}
function zastavSken(nechajRezim){
  SKEN.bezi = false;
  if (SKEN.stream) SKEN.stream.getTracks().forEach(t => t.stop());
  SKEN.stream = null; $('#scan').classList.remove('on');
  if (!nechajRezim) SKEN.rezim = '';
}
$('#scanStop').addEventListener('click', () => zastavSken());
$('#scanOk').addEventListener('click', () => { const t = $('#scanRucne').value.trim(); if (t) { spracujKod(t, ''); $('#scanRucne').value = ''; } });
$('#scanRucne').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#scanOk').click(); } });
$('#scanFoto').addEventListener('click', () => { $('#skenVstup').value = ''; $('#skenVstup').click(); });
$('#skenVstup').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#scanMsg').textContent = 'Čítam kód z fotky…';
  try {
    const det = await detektor(1600); if (!det) throw new Error('Tento prehliadač nevie čítať kódy – napíšte číslo.');
    const kody = (await det(await obrazok(f))).filter(k => !kodVyrobku(k.format));
    if (!kody.length) { $('#scanMsg').textContent = 'Na fotke som nenašiel QR kód – odfoťte ho bližšie a ostrejšie, alebo napíšte číslo.'; return; }
    kody.sort((a, b) => (b.format === 'qr_code') - (a.format === 'qr_code'));
    spracujKod(String(kody[0].rawValue).trim(), kody[0].format);
    if (SKEN.bezi) $('#scanFoto').textContent = 'Odfotiť ďalší kód';
  } catch(err) { $('#scanMsg').textContent = err.message; }
});

let fotkaPre = '';
async function zmensi(subor, max){
  const img = await obrazok(subor);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75).split(',')[1];
}
$('#fotoVstup').addEventListener('change', async e => {

  toast('Nahrávam fotku…', 4000);
  try { await api('foto', C.pin, id, await zmensi(f, 1600)); toast('Fotka uložená'); sync(); }
  catch(err) { toast(jeSiet(err) ? 'Fotka sa dá nahrať len so signálom.' : 'Fotka sa neuložila: ' + err.message, 3500); }
});
$('#foto').addEventListener('click', () => $('#foto').classList.remove('on'));
$('#importVstup').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const v = vrch(); if (!v) return;
  try {
    if (!window.XLSX) throw new Error('Knižnica pre Excel sa ešte načítava, skúste o chvíľu.');
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
    const meno = wb.SheetNames.find(n => /dump/i.test(n)) || wb.SheetNames.find(n => { const r = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, range:0}); return r[0] && r[0].includes('VYROBNE_CISLO'); });
    if (!meno) throw new Error('V súbore nie je hárok so stĺpcom VYROBNE_CISLO.');
    const riadky = XLSX.utils.sheet_to_json(wb.Sheets[meno], {header:1, defval:'', raw:true});
    const data = spinNaZaznamy(riadky);
    Object.assign(v.st, {faza:'nahlad', subor:f.name, data, suhrn:data.suhrn, chyba:'', popis:'stav k ' + new Date(f.lastModified || Date.now()).toLocaleDateString('sk-SK')});
  } catch(err) { v.st.faza = 'vyber'; v.st.chyba = err.message; }
  renderModal();
});

/* ---------- Excel výstupy ---------- */
function list(wb, nazov, hlav, riadky, sirky){
  const ws = XLSX.utils.aoa_to_sheet([hlav].concat(riadky));
  ws['!cols'] = (sirky || hlav.map(() => 16)).map(w => ({wch:w}));
  ws['!autofilter'] = {ref:XLSX.utils.encode_range({s:{r:0, c:0}, e:{r:riadky.length, c:hlav.length - 1}})};
  XLSX.utils.book_append_sheet(wb, ws, nazov);
}
const d10 = s => s ? fmtD(s) : '';
function stiahniVydajniky(arr){
  const wb = XLSX.utils.book_new();
  list(wb, 'Výdajníky', ['Výrobné číslo','Ev. č.','Model','Stav','Miesto','Mesto','IČO','Od kedy','Posl. sanitácia','Posl. oprava','Revízia','Návrh na vyradenie','Vlastník','Zaradený','Obst. cena €','Poznámka'],
    arr.map(v => { const m = miesto(v.miesto) || {}; return [v.vc, v.ev, v.model, STAVY[v.stav] || v.stav, m.nazov || v.miesto, m.mesto || '', m.ico || '', d10(v.odKedy), d10(v.sanitacia), d10(v.oprava), d10(v.revizia), v.navrh, v.vlastnik || 'náš', d10(v.zaradenie), num(v.obstCena), v.pozn]; }),
    [22,9,28,20,36,16,11,11,12,12,11,16,18,11,11,30]);
  XLSX.writeFile(wb, `Vydajniky_${dnes()}.xlsx`);
}
function stiahniStav(){
  const wb = XLSX.utils.book_new(), zak = {};
  for (const v of Object.values(V.vyd)) if (v.stav === 'zakaznik') (zak[v.miesto] = zak[v.miesto] || []).push(v);
  const mm = id => miesto(id) || {nazov:id};
  list(wb, 'Po zákazníkoch', ['Zákazník (odberné miesto)','Mesto','IČO','Fakturačná firma','IČO fakt.','Kusov spolu','z toho naše','z toho zákaznícke'],
    Object.entries(zak).sort((a, b) => mm(a[0]).nazov.localeCompare(mm(b[0]).nazov, 'sk')).map(([id, a]) => { const m = mm(id); return [m.nazov, m.mesto, m.ico, m.fakt, m.faktIco, a.length, a.filter(nasVlastnik).length, a.filter(v => !nasVlastnik(v)).length]; }),
    [40,18,11,40,11,10,10,12]);
  list(wb, 'Kusy', ['Zákazník','Mesto','IČO','Fakturačná firma','Výrobné číslo','Ev. č.','Model','Vlastník','U zákazníka od','Posl. sanitácia'],
    Object.values(V.vyd).filter(v => v.stav === 'zakaznik').map(v => { const m = mm(v.miesto); return [m.nazov, m.mesto, m.ico, m.fakt, v.vc, v.ev, v.model, v.vlastnik || 'náš', d10(v.odKedy), d10(v.sanitacia)]; }),
    [40,18,11,40,22,9,28,18,13,13]);
  XLSX.writeFile(wb, `Vydajniky_u_zakaznikov_${dnes()}.xlsx`);
}
function stiahniVykaz(r, od, po){
  const wb = XLSX.utils.book_new(), z = {};
  const mm = id => miesto(id) || {nazov:id || '—'};
  const zak = id => (z[id] = z[id] || {vydaj:0, prijem:0, sanit:0, oprava:0, porucha:0});
  for (const p of r.pohyby) { if (p.typ === 'vydaj') zak(p.kam).vydaj++; if (p.typ === 'prijem') zak(p.z).prijem++; }
  for (const s of r.servis) { if (!jeSklad(s.miesto) && s.miesto) { if (s.typ === 'sanitacia') zak(s.miesto).sanit++; if (s.typ === 'oprava') zak(s.miesto).oprava++; if (s.typ === 'porucha') zak(s.miesto).porucha++; } }
  list(wb, 'Po zákazníkoch', ['Zákazník','Mesto','IČO','Fakturačná firma','IČO fakt.','Výdaje','Zvozy','Sanitácie u zák.','Opravy u zák.','Poruchy','Teraz u zákazníka'],
    Object.entries(z).filter(([id]) => id && !jeSklad(id)).sort((a, b) => mm(a[0]).nazov.localeCompare(mm(b[0]).nazov, 'sk')).map(([id, x]) => { const m = mm(id);
      return [m.nazov, m.mesto, m.ico, m.fakt, m.faktIco, x.vydaj, x.prijem, x.sanit, x.oprava, x.porucha, (V.poMieste[id] || []).filter(v => v.stav === 'zakaznik').length]; }),
    [40,18,11,40,11,8,8,10,10,8,10]);
  list(wb, 'Pohyby', ['Dátum a čas','Druh','Výrobné číslo','Model','Odkiaľ','Kam','Dodací list','Kto','Poznámka','Podpísal'],
    r.pohyby.map(p => [fmtCas(p.cas), TYPY_POHYBU[p.typ] || p.typ, p.vc, (V.vyd[p.vyd] || {}).model || '', mm(p.z).nazov, mm(p.kam).nazov, p.dl, p.kto, p.pozn, String(p.podpis || '').split('|')[0]]), [16,22,22,26,34,34,12,18,30,20]);
  list(wb, 'Servis', ['Dátum a čas','Druh','Výsledok','Výrobné číslo','Model','Kde','Poznámka','Vymenené súčiastky','Kto'],
    r.servis.map(s => [fmtCas(s.cas), nazovServisu(s), VYSLEDKY[s.vysledok] || s.vysledok, s.vc, (V.vyd[s.vyd] || {}).model || '', mm(s.miesto).nazov, rozdelPopis(s).popis, s.diely, s.kto]), [16,24,16,22,26,30,40,30,18]);
  const kto = {};
  for (const s of r.servis) if (s.typ === 'sanitacia') kto[s.kto] = (kto[s.kto] || 0) + 1;
  list(wb, 'Sanitácie po ľuďoch', ['Kto','Sanitácií'], Object.entries(kto).sort((a, b) => b[1] - a[1]), [24,10]);
  XLSX.writeFile(wb, `Vykaz_vydajniky_${od}_${po}.xlsx`);
}
